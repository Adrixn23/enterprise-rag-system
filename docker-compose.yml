services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: enterprise-rag-sql
    user: "0:0"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Pass123!}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-rag-api
    depends_on:
      sqlserver:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=EnterpriseRagDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Pass123!};TrustServerCertificate=True;
      - ConnectionStrings__IdentityConnection=Server=sqlserver,1433;Database=EnterpriseRagIdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Pass123!};TrustServerCertificate=True;
      - VectorStore__Endpoint=http://qdrant:6334
      - Gemini__ApiKey=${Gemini__ApiKey}
      - Gemini__Model=${Gemini__Model:-gemini-2.5-flash}
      - Gemini__EmbeddingModel=${Gemini__EmbeddingModel:-gemini-embedding-001}
      - Jwt__Secret=${Jwt__Secret:-SuperSecretKeyWithAtLeast32BytesLengthForSecurityCompliance!}
      - Jwt__Issuer=${Jwt__Issuer:-EnterpriseRagApi}
      - Jwt__Audience=${Jwt__Audience:-EnterpriseRagClient}
    ports:
      - "5235:8080"
    volumes:
      - uploads_data:/app/Storage/Uploads

volumes:
  sql_data:
  qdrant_data:
  uploads_data:
