name: Enterprise RAG CI

on:
  push:
    branches: [ main, development, "feature/**" ]
  pull_request:
    branches: [ main, development ]

jobs:
  backend:
    name: Backend Build, Unit Tests & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore EnterpriseRag.slnx

      - name: Build solution (Release)
        run: dotnet build EnterpriseRag.slnx --configuration Release --no-restore

      - name: Run unit tests (non-browser)
        run: dotnet test tests/EnterpriseRag.UnitTests/EnterpriseRag.UnitTests.csproj --configuration Release --no-build --filter "FullyQualifiedName!~Playwright"

      - name: Check vulnerable NuGet packages
        run: dotnet list EnterpriseRag.slnx package --vulnerable --include-transitive

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Audit high-severity npm vulnerabilities
        run: npm audit --audit-level=high
